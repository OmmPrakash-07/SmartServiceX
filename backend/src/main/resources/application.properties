spring.application.name=smart-service-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_service_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET:SmartServiceXDevelopmentSecretKey2026ForLocalOnly}
jwt.expiration=${JWT_EXPIRATION:3600000}

assignment.service.url=${ASSIGNMENT_SERVICE_URL:http://localhost:5094}
classification.service.url=${CLASSIFICATION_SERVICE_URL:http://localhost:8000}