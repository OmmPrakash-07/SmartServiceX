spring.application.name=smart-service-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/smart_service_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=${JWT_SECRET:SmartServiceXDevelopmentSecretKey2026ForLocalOnly}
jwt.expiration=3600000

assignment.service.url=http://localhost:5094
classification.service.url=http://localhost:8000